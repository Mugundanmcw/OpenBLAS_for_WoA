name: Windows ARM64 cirun

on:
  push:
    branches:
      - develop
      - release-**
  pull_request:
    branches:
      - develop
      - release-**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    # if: "github.repository == 'OpenMathLib/OpenBLAS'"
    runs-on: windows-11-arm
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup visual studio
        uses: microsoft/setup-msbuild@v2
        
      - name: Install LLVM for Win-ARM64
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.6/LLVM-20.1.6-woa64.exe -UseBasicParsing -OutFile LLVM-woa64.exe
          Start-Process -FilePath ".\LLVM-woa64.exe" -ArgumentList "/S" -Wait
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "FC=flang-new" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
      - name: Install CMake for Win-ARM64
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Kitware/CMake/releases/download/v4.0.3/cmake-4.0.3-windows-arm64.msi -UseBasicParsing -OutFile cmake-arm64.msi
          Start-Process msiexec.exe -ArgumentList "/i cmake-arm64.msi /quiet /norestart" -Wait
          echo "C:\Program Files\CMake\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
      - name: Configure OpenBLAS
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvarsarm64.bat"
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DTARGET=ARMV8 -DBINARY=64 -DCMAKE_C_COMPILER=clang-cl -DCMAKE_Fortran_COMPILER=flang-new -DBUILD_SHARED_LIBS=ON
          
      - name: Build OpenBLAS
        shell: pwsh
        run: |
          cd build
          ninja -j16
          
      - name: Run tests
        id: run-ctest
        timeout-minutes: 60
        shell: pwsh
        run: |
          cd build
          ctest
