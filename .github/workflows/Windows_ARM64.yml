name: Windows ARM64 cirun

on:
  push:
    branches:
      - develop
      - release-**
  pull_request:
    branches:
      - develop
      - release-**

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    # if: "github.repository == 'OpenMathLib/OpenBLAS'"
    runs-on: windows-11-arm
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup visual studio
        uses: microsoft/setup-msbuild@v2
        
      - name: Install LLVM for Win-ARM64
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.6/LLVM-20.1.6-woa64.exe -UseBasicParsing -OutFile LLVM-woa64.exe
          Start-Process -FilePath ".\LLVM-woa64.exe" -ArgumentList "/S" -Wait
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "FC=flang-new" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          architecture: arm64

      - name: Update CMake for WoA
        run: |
          pip install cmake
          get-command cmake
          cmake --version
          
      - name: Install Ninja Build System
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-winarm64.zip -UseBasicParsing -OutFile ninja-winarm64.zip
          Expand-Archive -Path ninja-winarm64.zip -DestinationPath C:\ninja
          echo "C:\ninja" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
      - name: Configure OpenBLAS
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" arm64
          mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DTARGET=ARMV8 -DBINARY=64 -DCMAKE_C_COMPILER=clang-cl -DCMAKE_Fortran_COMPILER=flang-new -DBUILD_SHARED_LIBS=ON
          
      - name: Build OpenBLAS
        shell: pwsh
        run: |
          cd build
          ninja -j16
          
      - name: Run tests
        id: run-ctest
        timeout-minutes: 60
        shell: pwsh
        run: |
          cd build
          ctest
